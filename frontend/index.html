    <!-- Apply the saved mode + accent before first paint to avoid a color flash.
         Defaults: light mode, Calm Teal. Values are injected from src/theme/accents.ts at build. -->
    <script>
      (function () {
        var cfg = __THEME_CONFIG__;
        var root = document.documentElement;
        var accent = cfg.defaultAccent;
        try {
          if (localStorage.getItem(cfg.modeKey) === 'dark') root.classList.add('dark');
          var saved = localStorage.getItem(cfg.accentKey);
          if (cfg.showSwitcher && cfg.accents.indexOf(saved) !== -1) accent = saved;
        } catch (e) {}
        root.setAttribute('data-accent', accent);
      })();
    </script>
