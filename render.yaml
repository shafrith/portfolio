# Render Blueprint for the API. https://render.com/docs/blueprint-spec
# Values marked `sync: false` are secrets: Render asks you for them when you create the Blueprint.
services:
  - type: web
    name: shafrith-portfolio-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Your Vercel URL(s), comma-separated, no trailing slash. Updated after the frontend deploy.
      - key: CORS_ORIGINS
        value: https://shafrith-portfolio.vercel.app
      # Render sits behind a proxy: needed so the 10-questions-a-day limit is per visitor.
      - key: TRUST_PROXY_HEADERS
        value: "true"

      # Ask my AI
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false

      # Contact form emails via Resend (Render's free plan blocks SMTP)
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        value: shafrith777@gmail.com
