# Render Blueprint for the API. https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shafrith-portfolio-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://shafrith-portfolio.vercel.app  # TODO: your final frontend domain
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CONTACT_TO_EMAIL
        value: shafrith777@gmail.com
